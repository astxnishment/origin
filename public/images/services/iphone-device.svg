<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" fill="none">
  <defs>
    <linearGradient id="iPhoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2c30"/>
      <stop offset="100%" stop-color="#16161a"/>
    </linearGradient>
    <linearGradient id="iPhoneScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2840"/>
      <stop offset="55%" stop-color="#0c1520"/>
      <stop offset="100%" stop-color="#080e16"/>
    </linearGradient>
    <linearGradient id="iPhoneGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="iPhoneSheen" cx="25%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="iPhoneGlowFilter">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Phone body -->
  <rect x="28" y="16" width="184" height="448" rx="38" fill="url(#iPhoneBody)" stroke="#3a3a40" stroke-width="1"/>
  <!-- Body highlight (sheen) -->
  <rect x="28" y="16" width="184" height="448" rx="38" fill="url(#iPhoneSheen)"/>

  <!-- Screen bezel -->
  <rect x="33" y="21" width="174" height="438" rx="35" fill="#0f0f12"/>
  <!-- Screen -->
  <rect x="34" y="22" width="172" height="436" rx="34" fill="url(#iPhoneScreen)"/>
  <!-- Screen top glow -->
  <rect x="34" y="22" width="172" height="220" rx="34" fill="url(#iPhoneGlow)"/>

  <!-- Dynamic Island -->
  <rect x="87" y="38" width="66" height="24" rx="12" fill="#0a0a0e"/>
  <!-- Camera within Dynamic Island -->
  <circle cx="140" cy="50" r="7" fill="#0d0d12"/>
  <circle cx="140" cy="50" r="4.5" fill="#111118"/>
  <circle cx="140" cy="50" r="2" fill="#1a1a28" stroke="#242430" stroke-width="0.5"/>
  <!-- FaceID dot -->
  <circle cx="108" cy="50" r="3" fill="#111118"/>

  <!-- Status bar -->
  <rect x="50" y="34" width="18" height="3" rx="1.5" fill="#3b82f6" opacity="0.35"/>
  <rect x="175" y="34" width="14" height="3" rx="1.5" fill="#ffffff" opacity="0.15"/>

  <!-- Screen content — time -->
  <rect x="78" y="82" width="84" height="20" rx="5" fill="#ffffff" opacity="0.07"/>

  <!-- Notification cards -->
  <rect x="44" y="120" width="152" height="52" rx="14" fill="#ffffff" opacity="0.05" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.25"/>
  <circle cx="60" cy="146" r="10" fill="#3b82f6" opacity="0.6"/>
  <rect x="76" y="136" width="76" height="5" rx="2.5" fill="#ffffff" opacity="0.2"/>
  <rect x="76" y="148" width="52" height="4" rx="2" fill="#ffffff" opacity="0.1"/>

  <rect x="44" y="182" width="152" height="52" rx="14" fill="#ffffff" opacity="0.04"/>
  <circle cx="60" cy="208" r="10" fill="#22c55e" opacity="0.5"/>
  <rect x="76" y="198" width="60" height="5" rx="2.5" fill="#ffffff" opacity="0.15"/>
  <rect x="76" y="210" width="88" height="4" rx="2" fill="#ffffff" opacity="0.08"/>

  <!-- Widget row -->
  <rect x="44" y="248" width="68" height="68" rx="16" fill="#0d1f38" opacity="0.8" stroke="#1a3060" stroke-width="0.5"/>
  <rect x="128" y="248" width="68" height="68" rx="16" fill="#0d1f38" opacity="0.7" stroke="#1a3060" stroke-width="0.5"/>
  <rect x="56" y="268" width="20" height="4" rx="2" fill="#3b82f6" opacity="0.6"/>
  <rect x="56" y="276" width="44" height="8" rx="4" fill="#ffffff" opacity="0.12"/>
  <rect x="140" y="268" width="44" height="4" rx="2" fill="#ffffff" opacity="0.1"/>
  <rect x="140" y="276" width="30" height="8" rx="4" fill="#22c55e" opacity="0.35"/>

  <!-- App grid -->
  <rect x="44" y="332" width="36" height="36" rx="9" fill="#3b82f6" opacity="0.5"/>
  <rect x="90" y="332" width="36" height="36" rx="9" fill="#8b5cf6" opacity="0.4"/>
  <rect x="136" y="332" width="36" height="36" rx="9" fill="#f59e0b" opacity="0.35"/>
  <rect x="182" y="332" width="14" height="36" rx="7" fill="#ef4444" opacity="0.3"/>

  <!-- Dock -->
  <rect x="36" y="386" width="168" height="58" rx="18" fill="#ffffff" opacity="0.04" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>
  <rect x="52" y="400" width="30" height="30" rx="8" fill="#3b82f6" opacity="0.55"/>
  <rect x="93" y="400" width="30" height="30" rx="8" fill="#22c55e" opacity="0.4"/>
  <rect x="134" y="400" width="30" height="30" rx="8" fill="#f59e0b" opacity="0.35"/>
  <rect x="175" y="400" width="17" height="30" rx="7" fill="#8b5cf6" opacity="0.35"/>

  <!-- Home indicator -->
  <rect x="88" y="453" width="64" height="4" rx="2" fill="#ffffff" opacity="0.2"/>

  <!-- Side buttons -->
  <!-- Power button (right) -->
  <rect x="210" y="152" width="4" height="58" rx="2" fill="#3a3a40"/>
  <!-- Volume / Action (left) -->
  <rect x="26" y="128" width="3.5" height="18" rx="1.75" fill="#3a3a40"/>
  <rect x="26" y="158" width="3.5" height="38" rx="1.75" fill="#3a3a40"/>
  <rect x="26" y="204" width="3.5" height="38" rx="1.75" fill="#3a3a40"/>

  <!-- Blue glow accent on left edge -->
  <rect x="28" y="360" width="3" height="70" rx="1.5" fill="#3b82f6" opacity="0.3" filter="url(#iPhoneGlowFilter)"/>
</svg>

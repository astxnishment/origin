  <rect x="416" y="60" width="56" height="5" rx="2.5" fill="#ffffff" opacity="0.1"/>
  <rect x="416" y="73" width="40" height="5" rx="2.5" fill="#3b82f6" opacity="0.35"/>
  <rect x="416" y="86" width="50" height="5" rx="2.5" fill="#ffffff" opacity="0.07"/>

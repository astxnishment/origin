  <rect x="258" y="351" width="18" height="8" rx="2" fill="#2a2a30" opacity="0.75"/>
  <rect x="280" y="351" width="18" height="8" rx="2" fill="#2a2a30" opacity="0.75"/>
  <rect x="302" y="351" width="18" height="8" rx="2" fill="#2a2a30" opacity="0.75"/>
  <rect x="324" y="351" width="54" height="8" rx="2" fill="#2a2a30" opacity="0.75"/>
  <!-- Space bar row -->
  <rect x="52" y="364" width="22" height="8" rx="2" fill="#2a2a30" opacity="0.7"/>
  <rect x="78" y="364" width="22" height="8" rx="2" fill="#2a2a30" opacity="0.7"/>
  <rect x="104" y="364" width="22" height="8" rx="2" fill="#2a2a30" opacity="0.7"/>
  <rect x="130" y="364" width="176" height="8" rx="2" fill="#2a2a30" opacity="0.7"/>
  <rect x="310" y="364" width="22" height="8" rx="2" fill="#2a2a30" opacity="0.7"/>

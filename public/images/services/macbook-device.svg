  <rect x="294" y="338" width="18" height="8" rx="2" fill="#2a2a30" opacity="0.8"/>
  <rect x="316" y="338" width="18" height="8" rx="2" fill="#2a2a30" opacity="0.8"/>
  <rect x="338" y="338" width="40" height="8" rx="2" fill="#2a2a30" opacity="0.8"/>
  <!-- Row 3 -->
  <rect x="52" y="351" width="26" height="8" rx="2" fill="#2a2a30" opacity="0.75"/>
  <rect x="82" y="351" width="18" height="8" rx="2" fill="#2a2a30" opacity="0.75"/>
  <rect x="104" y="351" width="18" height="8" rx="2" fill="#2a2a30" opacity="0.75"/>
  <rect x="126" y="351" width="18" height="8" rx="2" fill="#2a2a30" opacity="0.75"/>

  <!-- Dock at bottom of screen -->
  <rect x="148" y="270" width="264" height="28" rx="14" fill="#ffffff" opacity="0.05" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.08"/>
  <rect x="160" y="277" width="16" height="14" rx="4" fill="#3b82f6" opacity="0.5"/>
  <rect x="183" y="277" width="16" height="14" rx="4" fill="#22c55e" opacity="0.4"/>
  <rect x="206" y="277" width="16" height="14" rx="4" fill="#f59e0b" opacity="0.35"/>

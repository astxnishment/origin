<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none">
  <defs>
    <linearGradient id="mbBase" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#18181c"/>
    </linearGradient>
    <linearGradient id="mbLid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242428"/>
      <stop offset="100%" stop-color="#1a1a1e"/>
    </linearGradient>
    <linearGradient id="mbScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18263e"/>
      <stop offset="50%" stop-color="#0c1520"/>
      <stop offset="100%" stop-color="#080d16"/>
    </linearGradient>
    <linearGradient id="mbGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mbKeyboard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e22"/>
      <stop offset="100%" stop-color="#161618"/>
    </linearGradient>
    <radialGradient id="mbSheen" cx="30%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="mbGlowF">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── LID ──────────────────────────────────────────────────────── -->
  <!-- Lid outer -->
  <rect x="28" y="8" width="504" height="302" rx="12" fill="url(#mbLid)" stroke="#3a3a40" stroke-width="1"/>
  <rect x="28" y="8" width="504" height="302" rx="12" fill="url(#mbSheen)"/>
  <!-- Screen bezel -->
  <rect x="33" y="12" width="494" height="294" rx="10" fill="#0c0c0e"/>
  <!-- Screen -->
  <rect x="34" y="13" width="492" height="292" rx="9" fill="url(#mbScreen)"/>
  <!-- Screen glow -->
  <rect x="34" y="13" width="492" height="146" rx="9" fill="url(#mbGlow)"/>

  <!-- Notch -->
  <rect x="246" y="12" width="68" height="18" rx="0 0 9 9" fill="#0c0c0e"/>
  <!-- Notch camera -->
  <circle cx="280" cy="21" r="4" fill="#111118"/>
  <circle cx="280" cy="21" r="2.5" fill="#1a1a28"/>

  <!-- Screen content — menu bar -->
  <rect x="34" y="13" width="492" height="20" rx="0" fill="#000000" opacity="0.4"/>
  <rect x="46" y="18" width="8" height="8" rx="2" fill="#ffffff" opacity="0.3"/>
  <rect x="62" y="20" width="28" height="4" rx="2" fill="#ffffff" opacity="0.15"/>
  <rect x="98" y="20" width="22" height="4" rx="2" fill="#ffffff" opacity="0.1"/>
  <rect x="128" y="20" width="28" height="4" rx="2" fill="#ffffff" opacity="0.1"/>

  <!-- Desktop UI — browser window -->
  <rect x="50" y="42" width="340" height="220" rx="8" fill="#0a1a30" opacity="0.85" stroke="#1a3060" stroke-width="0.5"/>
  <rect x="50" y="42" width="340" height="28" rx="8 8 0 0" fill="#0d1f38" opacity="0.9"/>
  <circle cx="66" cy="56" r="5" fill="#ef4444" opacity="0.6"/>
  <circle cx="82" cy="56" r="5" fill="#f59e0b" opacity="0.6"/>
  <circle cx="98" cy="56" r="5" fill="#22c55e" opacity="0.6"/>
  <rect x="116" y="52" width="180" height="8" rx="4" fill="#ffffff" opacity="0.08"/>

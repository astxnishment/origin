  <rect x="66" y="100" width="288" height="5" rx="2.5" fill="#ffffff" opacity="0.1"/>
  <rect x="66" y="112" width="240" height="5" rx="2.5" fill="#ffffff" opacity="0.07"/>
  <rect x="66" y="124" width="200" height="5" rx="2.5" fill="#ffffff" opacity="0.07"/>
  <rect x="66" y="148" width="288" height="60" rx="8" fill="#0d2340" opacity="0.7"/>
  <rect x="66" y="148" width="4" height="60" rx="2" fill="#3b82f6" opacity="0.8"/>
  <rect x="78" y="158" width="100" height="5" rx="2.5" fill="#3b82f6" opacity="0.4"/>
  <rect x="78" y="170" width="200" height="4" rx="2" fill="#ffffff" opacity="0.1"/>
  <rect x="78" y="180" width="160" height="4" rx="2" fill="#ffffff" opacity="0.07"/>

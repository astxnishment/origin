<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 530" fill="none">
  <defs>
    <linearGradient id="iPadBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2c30"/>
      <stop offset="100%" stop-color="#16161a"/>
    </linearGradient>
    <linearGradient id="iPadScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18263e"/>
      <stop offset="50%" stop-color="#0c1620"/>
      <stop offset="100%" stop-color="#080f18"/>
    </linearGradient>
    <linearGradient id="iPadGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="iPadSheen" cx="20%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="iPadGlowF">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Tablet body -->
  <rect x="22" y="14" width="356" height="502" rx="22" fill="url(#iPadBody)" stroke="#3a3a40" stroke-width="1"/>
  <rect x="22" y="14" width="356" height="502" rx="22" fill="url(#iPadSheen)"/>

  <!-- Screen bezel -->
  <rect x="26" y="18" width="348" height="494" rx="19" fill="#0f0f12"/>
  <!-- Screen -->
  <rect x="27" y="19" width="346" height="492" rx="18" fill="url(#iPadScreen)"/>
  <!-- Top glow -->
  <rect x="27" y="19" width="346" height="260" rx="18" fill="url(#iPadGlow)"/>

  <!-- Front camera (top center) -->
  <circle cx="200" cy="34" r="5" fill="#0a0a0e"/>
  <circle cx="200" cy="34" r="3" fill="#111118"/>
  <circle cx="200" cy="34" r="1.5" fill="#1a1a28"/>

  <!-- Status bar -->
  <rect x="50" y="28" width="24" height="3.5" rx="1.75" fill="#3b82f6" opacity="0.3"/>
  <rect x="330" y="28" width="18" height="3.5" rx="1.75" fill="#ffffff" opacity="0.12"/>

  <!-- Top app row — notification strip -->
  <rect x="40" y="54" width="320" height="42" rx="12" fill="#ffffff" opacity="0.04" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.2"/>
  <circle cx="62" cy="75" r="12" fill="#3b82f6" opacity="0.55"/>
  <rect x="82" y="68" width="90" height="5" rx="2.5" fill="#ffffff" opacity="0.18"/>
  <rect x="82" y="79" width="64" height="4" rx="2" fill="#ffffff" opacity="0.09"/>

  <!-- Large card area -->
  <rect x="40" y="108" width="200" height="130" rx="16" fill="#0d1f38" opacity="0.75" stroke="#1a3060" stroke-width="0.5"/>
  <rect x="40" y="108" width="200" height="8" rx="4" fill="#3b82f6" opacity="0.2"/>
  <rect x="56" y="128" width="80" height="6" rx="3" fill="#3b82f6" opacity="0.4"/>
  <rect x="56" y="142" width="130" height="5" rx="2.5" fill="#ffffff" opacity="0.12"/>
  <rect x="56" y="154" width="100" height="5" rx="2.5" fill="#ffffff" opacity="0.08"/>
  <rect x="56" y="196" width="60" height="22" rx="11" fill="#3b82f6" opacity="0.5"/>

  <!-- Sidebar card -->
  <rect x="252" y="108" width="108" height="130" rx="16" fill="#0d1f38" opacity="0.6" stroke="#1a3060" stroke-width="0.5"/>
  <rect x="268" y="128" width="44" height="44" rx="12" fill="#3b82f6" opacity="0.35"/>
  <rect x="268" y="180" width="76" height="5" rx="2.5" fill="#ffffff" opacity="0.12"/>
  <rect x="268" y="192" width="56" height="4" rx="2" fill="#ffffff" opacity="0.07"/>

  <!-- Middle row — app icons -->
  <rect x="40" y="252" width="72" height="72" rx="18" fill="#0d2340" opacity="0.8"/>
  <rect x="124" y="252" width="72" height="72" rx="18" fill="#0d2340" opacity="0.7"/>
  <rect x="208" y="252" width="72" height="72" rx="18" fill="#0d2340" opacity="0.65"/>
  <rect x="292" y="252" width="68" height="72" rx="18" fill="#0d2340" opacity="0.6"/>
  <rect x="52" y="272" width="48" height="32" rx="8" fill="#3b82f6" opacity="0.3"/>
  <rect x="136" y="272" width="48" height="32" rx="8" fill="#22c55e" opacity="0.25"/>
  <rect x="220" y="272" width="48" height="32" rx="8" fill="#f59e0b" opacity="0.25"/>
  <rect x="304" y="272" width="44" height="32" rx="8" fill="#8b5cf6" opacity="0.25"/>

  <!-- Bottom row -->
  <rect x="40" y="336" width="72" height="72" rx="18" fill="#0d2340" opacity="0.65"/>
  <rect x="124" y="336" width="72" height="72" rx="18" fill="#0d2340" opacity="0.6"/>
  <rect x="208" y="336" width="72" height="72" rx="18" fill="#0d2340" opacity="0.55"/>
  <rect x="292" y="336" width="68" height="72" rx="18" fill="#0d2340" opacity="0.5"/>

  <!-- Dock -->
  <rect x="52" y="428" width="296" height="62" rx="20" fill="#ffffff" opacity="0.04" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>
  <rect x="72" y="444" width="40" height="30" rx="9" fill="#3b82f6" opacity="0.5"/>
  <rect x="128" y="444" width="40" height="30" rx="9" fill="#22c55e" opacity="0.35"/>
  <rect x="184" y="444" width="40" height="30" rx="9" fill="#f59e0b" opacity="0.3"/>
  <rect x="240" y="444" width="40" height="30" rx="9" fill="#8b5cf6" opacity="0.3"/>
  <rect x="296" y="444" width="40" height="30" rx="9" fill="#ef4444" opacity="0.25"/>

  <!-- Home indicator -->
  <rect x="164" y="498" width="72" height="4" rx="2" fill="#ffffff" opacity="0.18"/>

  <!-- Side buttons -->
  <rect x="376" y="168" width="4" height="52" rx="2" fill="#3a3a40"/>
  <rect x="20" y="152" width="3.5" height="36" rx="1.75" fill="#3a3a40"/>
  <rect x="20" y="196" width="3.5" height="36" rx="1.75" fill="#3a3a40"/>

  <!-- Apple Pencil magnetic edge hint -->
  <rect x="22" y="420" width="4" height="60" rx="2" fill="#3b82f6" opacity="0.25" filter="url(#iPadGlowF)"/>
</svg>

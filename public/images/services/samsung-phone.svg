<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2a3e"/>
      <stop offset="60%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Phone body -->
  <rect x="30" y="18" width="180" height="444" rx="26" fill="url(#bodyGrad)" stroke="#3a3a3f" stroke-width="1"/>

  <!-- Body sheen / highlight -->
  <rect x="30" y="18" width="180" height="444" rx="26" fill="url(#sheen)"/>

  <!-- Screen bezel -->
  <rect x="36" y="38" width="168" height="404" rx="20" fill="#0f0f12"/>

  <!-- Screen -->
  <rect x="38" y="40" width="164" height="400" rx="19" fill="url(#screenGrad)"/>

  <!-- Screen top glow -->
  <rect x="38" y="40" width="164" height="200" rx="19" fill="url(#glowGrad)"/>

  <!-- Punch-hole camera -->
  <circle cx="120" cy="62" r="5.5" fill="#0a0a10"/>
  <circle cx="120" cy="62" r="3.5" fill="#111118" stroke="#2a2a32" stroke-width="0.5"/>

  <!-- Status bar indicators -->
  <rect x="60" y="56" width="24" height="3" rx="1.5" fill="#3b82f6" opacity="0.4"/>
  <rect x="157" y="56" width="12" height="3" rx="1.5" fill="#3b82f6" opacity="0.25"/>

  <!-- Screen content — time -->
  <rect x="88" y="86" width="64" height="16" rx="4" fill="#ffffff" opacity="0.08"/>

  <!-- Notification cards -->
  <rect x="52" y="120" width="136" height="44" rx="10" fill="#ffffff" opacity="0.05" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="62" y="130" width="8" height="8" rx="2" fill="#3b82f6" opacity="0.7"/>
  <rect x="76" y="130" width="60" height="4" rx="2" fill="#ffffff" opacity="0.2"/>
  <rect x="76" y="139" width="40" height="3" rx="1.5" fill="#ffffff" opacity="0.1"/>

  <rect x="52" y="172" width="136" height="44" rx="10" fill="#ffffff" opacity="0.04"/>
  <rect x="62" y="182" width="8" height="8" rx="2" fill="#22c55e" opacity="0.5"/>
  <rect x="76" y="182" width="50" height="4" rx="2" fill="#ffffff" opacity="0.15"/>
  <rect x="76" y="191" width="70" height="3" rx="1.5" fill="#ffffff" opacity="0.08"/>

  <!-- App dock -->
  <rect x="44" y="390" width="152" height="40" rx="12" fill="#ffffff" opacity="0.04" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>
  <rect x="56" y="400" width="22" height="22" rx="6" fill="#3b82f6" opacity="0.5"/>
  <rect x="86" y="400" width="22" height="22" rx="6" fill="#22c55e" opacity="0.35"/>
  <rect x="116" y="400" width="22" height="22" rx="6" fill="#8b5cf6" opacity="0.35"/>
  <rect x="146" y="400" width="22" height="22" rx="6" fill="#f59e0b" opacity="0.3"/>

  <!-- Home indicator -->
  <rect x="94" y="448" width="52" height="3.5" rx="1.75" fill="#ffffff" opacity="0.18"/>

  <!-- Side buttons -->
  <rect x="208" y="144" width="3.5" height="52" rx="1.75" fill="#3a3a3f"/>
  <rect x="28.5" y="148" width="3.5" height="32" rx="1.75" fill="#3a3a3f"/>
  <rect x="28.5" y="192" width="3.5" height="32" rx="1.75" fill="#3a3a3f"/>

  <!-- Blue accent edge glow (bottom left — Samsung vibe) -->
  <rect x="30" y="340" width="3" height="80" rx="1.5" fill="#3b82f6" opacity="0.35" filter="url(#glow)"/>
</svg>
